<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 — STOCKPULSE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="shared.js"></script>
  <style>
    .admin-table{width:100%;border-collapse:collapse}
    .admin-table th{text-align:left;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--div2)}
    .admin-table td{padding:12px;font-size:14px;border-bottom:1px solid var(--div);vertical-align:middle}
    .admin-table tr:hover td{background:var(--hover)}
    .admin-check{width:18px;height:18px;accent-color:#06b6d4;cursor:pointer}
    .admin-check:disabled{cursor:default;opacity:.5}
    .admin-input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--inp-bd);background:var(--inp-bg);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
    .admin-input:focus{border-color:rgba(6,182,212,0.4)}
    .admin-btn{padding:10px 22px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
    .admin-btn-primary{background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff}
    .admin-btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .admin-btn-secondary{background:var(--card-bg);border:1px solid var(--card-bd);color:var(--text)}
    .admin-btn-secondary:hover{background:var(--card-hbg);border-color:var(--card-hbd)}
    .admin-btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#ef4444}
    .admin-btn-danger:hover{background:rgba(239,68,68,0.2)}
    .role-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block}
    .role-super{background:rgba(6,182,212,0.12);color:#06b6d4}
    .role-mod{background:rgba(139,92,246,0.12);color:#8b5cf6}
    .perm-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
    .perm-label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);cursor:pointer}
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100}
    .modal-box{background:var(--bg);border:1px solid var(--card-bd);border-radius:12px;padding:24px;width:360px;max-width:90%}
    .ban-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--div);transition:background .2s}
    .ban-item:last-child{border-bottom:none}
    .ban-item:hover{background:var(--hover)}
    .col-lbl{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--text)}
    .col-lbl span{font-weight:400;color:var(--muted);margin-left:6px}
    .col-seg{padding:5px 12px;border-radius:7px;border:1px solid var(--card-bd);background:var(--card-bg);color:var(--text-sub);font-size:12px;cursor:pointer;font-family:inherit}
    .col-seg.big{padding:8px 16px;font-size:14px}
    .col-seg.on{border-color:#06b6d4;color:#06b6d4;font-weight:600}
    .col-hints{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:6px;padding:8px 12px;border-radius:8px;background:var(--hover)}
    .col-prev h2{font-size:17px;margin:18px 0 8px}.col-prev h3{font-size:15px;margin:14px 0 6px}
    .col-prev p,.col-prev li{font-size:14px;line-height:1.8}.col-prev p{margin:0 0 10px}
    .col-prev ul,.col-prev ol{padding-left:20px;margin:0 0 10px}
    .col-prev blockquote{margin:0 0 10px;padding:6px 12px;border-left:3px solid var(--div2);color:var(--muted)}
    @media(max-width:700px){
      .admin-table th:nth-child(1){display:none}
      .admin-table td:nth-child(1){display:none}
      .admin-table td{padding:10px 8px;font-size:13px}
      .perm-row{gap:10px}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;

const PERM_KEYS=[
  {key:"delete_posts",label:"글 삭제"},
  {key:"delete_comments",label:"댓글 삭제"},
  {key:"edit_posts",label:"글 수정"},
  {key:"pin_posts",label:"공지 관리"},
  {key:"use_reserved_names",label:"예약 닉네임"}
];

async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function Box({children,hover=true,style={}}){
  return <div style={{background:"var(--card-bg)",border:"1px solid var(--card-bd)",borderRadius:12,padding:"20px",...style}}>{children}</div>;
}

function Loader(){
  return <div style={{textAlign:"center",padding:"60px 0"}}><div className="loader"></div></div>;
}

// ═══ 로그인 화면 ═══
function LoginScreen({onLogin}){
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const[cooldown,setCooldown]=useState(false);

  const submit=async()=>{
    if(!pw.trim()||pw.trim().length<2){setErr("비밀번호를 입력하세요");return}
    if(cooldown)return;
    setLoading(true);setErr("");
    try{
      const h=await hashPassword(pw.trim());
      const r=await fetch(SB_URL+"/rest/v1/rpc/admin_login",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_hash:h})});
      if(!r.ok)throw new Error(r.status);
      const data=await r.json();
      if(!data){
        setErr("관리자 비밀번호가 아닙니다");
        setCooldown(true);
        setTimeout(()=>setCooldown(false),3000);
      }else{
        onLogin(h,data);
      }
    }catch(e){setErr("로그인 실패: "+e.message)}
    setLoading(false);
  };

  return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"60vh"}}>
    <Box hover={false} style={{width:360,maxWidth:"90%",padding:"32px 28px"}}>
      <div style={{textAlign:"center",marginBottom:"24px"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>🔐</div>
        <div style={{fontSize:"20px",fontWeight:700}}>관리자 로그인</div>
        <div style={{fontSize:"13px",color:"var(--muted)",marginTop:"4px"}}>관리자 비밀번호를 입력하세요</div>
      </div>
      <input className="admin-input" type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoFocus/>
      {err&&<div style={{color:"#ef4444",fontSize:"13px",marginTop:"8px"}}>{err}</div>}
      <button className="admin-btn admin-btn-primary" onClick={submit} disabled={loading||cooldown} style={{width:"100%",marginTop:"16px"}}>{loading?"확인 중...":cooldown?"잠시 후 다시 시도":"로그인"}</button>
    </Box>
  </div>;
}

// ═══ 삭제 확인 모달 ═══
function ConfirmModal({nickname,onConfirm,onCancel}){
  return <div className="modal-overlay" onClick={onCancel}>
    <div className="modal-box" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"12px"}}>관리자 삭제</div>
      <div style={{fontSize:"14px",color:"var(--text-sub)",marginBottom:"20px",lineHeight:1.6}}>
        <strong>{nickname}</strong> 관리자를 삭제하시겠습니까?<br/>이 작업은 되돌릴 수 없습니다.
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <button className="admin-btn admin-btn-secondary" onClick={onCancel}>취소</button>
        <button className="admin-btn admin-btn-danger" onClick={onConfirm}>삭제</button>
      </div>
    </div>
  </div>;
}

// ═══ 관리자 추가 폼 ═══
function AddAdminForm({adminHash,onAdded}){
  const[nick,setNick]=useState("");
  const[pw,setPw]=useState("");
  const[perms,setPerms]=useState({delete_posts:false,delete_comments:false,edit_posts:false,pin_posts:false,use_reserved_names:false});
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const toggle=(key)=>setPerms(p=>({...p,[key]:!p[key]}));

  const submit=async()=>{
    if(!nick.trim()){setErr("닉네임을 입력하세요");return}
    if(!pw.trim()||pw.trim().length<2){setErr("비밀번호는 2자 이상");return}
    setLoading(true);setErr("");
    try{
      const h=await hashPassword(pw.trim());
      const r=await fetch(SB_URL+"/rest/v1/rpc/add_board_admin",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash,p_nickname:nick.trim(),p_password_hash:h,p_permissions:perms})});
      if(!r.ok){
        const t=await r.text();
        if(t.includes("duplicate_nickname"))throw new Error("duplicate_nickname");
        if(t.includes("duplicate_password"))throw new Error("duplicate_password");
        throw new Error(r.status);
      }
      setNick("");setPw("");setPerms({delete_posts:false,delete_comments:false,edit_posts:false,pin_posts:false,use_reserved_names:false});
      onAdded();
    }catch(e){
      if(e.message==="duplicate_nickname")setErr("이미 존재하는 닉네임입니다");
      else if(e.message==="duplicate_password")setErr("이미 사용 중인 비밀번호입니다");
      else setErr("추가 실패: "+e.message);
    }
    setLoading(false);
  };

  return <Box hover={false} style={{marginTop:"24px",padding:"20px 24px"}}>
    <div style={{fontWeight:700,fontSize:"16px",marginBottom:"16px"}}>부관리자 추가</div>
    <div style={{display:"flex",gap:"8px",marginBottom:"8px",flexWrap:"wrap"}}>
      <input className="admin-input" placeholder="닉네임" value={nick} onChange={e=>setNick(e.target.value)} maxLength={10} style={{flex:"1 1 120px",minWidth:"100px"}}/>
      <input className="admin-input" type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} maxLength={20} style={{flex:"1 1 120px",minWidth:"100px"}}/>
    </div>
    <div style={{fontSize:"13px",color:"var(--muted)",marginBottom:"6px"}}>권한 선택</div>
    <div className="perm-row">
      {PERM_KEYS.map(p=><label key={p.key} className="perm-label">
        <input type="checkbox" className="admin-check" checked={perms[p.key]} onChange={()=>toggle(p.key)}/>
        {p.label}
      </label>)}
    </div>
    {err&&<div style={{color:"#ef4444",fontSize:"13px",marginTop:"10px"}}>{err}</div>}
    <div style={{marginTop:"16px",textAlign:"right"}}>
      <button className="admin-btn admin-btn-primary" onClick={submit} disabled={loading}>{loading?"추가 중...":"추가하기"}</button>
    </div>
  </Box>;
}

// ═══ 관리자 행 ═══
function AdminRow({admin,adminHash,onUpdated,onDelete}){
  const isSuper=admin.role==="superadmin";
  const[updating,setUpdating]=useState(null);

  const togglePerm=async(key)=>{
    if(isSuper)return;
    setUpdating(key);
    const newPerms={...admin.permissions,[key]:!admin.permissions[key]};
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/update_board_admin",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash,p_target_id:admin.id,p_permissions:newPerms})});
      if(!r.ok)throw new Error(r.status);
      onUpdated();
    }catch(e){console.error("Update error:",e)}
    setUpdating(null);
  };

  return <tr>
    <td style={{color:"var(--muted)",fontSize:"13px",textAlign:"center",width:40}}>{admin.id}</td>
    <td>
      <div style={{fontWeight:600}}>{admin.nickname}</div>
      <span className={"role-badge "+(isSuper?"role-super":"role-mod")}>{isSuper?"최고관리자":"부관리자"}</span>
    </td>
    {PERM_KEYS.map(p=><td key={p.key} style={{textAlign:"center",width:70}}>
      <input type="checkbox" className="admin-check" checked={!!admin.permissions[p.key]} disabled={isSuper||updating===p.key} onChange={()=>togglePerm(p.key)}/>
    </td>)}
    <td style={{textAlign:"center",width:60}}>
      {!isSuper&&<button className="admin-btn admin-btn-danger" onClick={()=>onDelete(admin)} style={{padding:"6px 12px",fontSize:"12px"}}>삭제</button>}
    </td>
  </tr>;
}

// ═══ 비밀번호 변경 모달 ═══
function ChangePwModal({adminHash,onChanged,onCancel}){
  const[newPw,setNewPw]=useState("");
  const[newPw2,setNewPw2]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!newPw.trim()||newPw.trim().length<4){setErr("새 비밀번호는 4자 이상");return}
    if(newPw!==newPw2){setErr("비밀번호가 일치하지 않습니다");return}
    setLoading(true);setErr("");
    try{
      const h=await hashPassword(newPw.trim());
      const r=await fetch(SB_URL+"/rest/v1/rpc/change_admin_password",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_old_hash:adminHash,p_new_hash:h})});
      if(!r.ok){const t=await r.text();if(t.includes("duplicate_password"))throw new Error("duplicate_password");throw new Error(r.status)}
      const result=await r.json();
      if(result===true){onChanged(h)}
      else{setErr("변경 실패")}
    }catch(e){
      if(e.message==="duplicate_password")setErr("이미 사용 중인 비밀번호입니다");
      else setErr("변경 실패: "+e.message);
    }
    setLoading(false);
  };

  return <div className="modal-overlay" onClick={onCancel}>
    <div className="modal-box" onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:700,fontSize:"16px",marginBottom:"16px"}}>🔑 비밀번호 변경</div>
      <input className="admin-input" type="password" placeholder="새 비밀번호 (4자 이상)" value={newPw} onChange={e=>setNewPw(e.target.value)} maxLength={30} style={{marginBottom:"8px"}}/>
      <input className="admin-input" type="password" placeholder="새 비밀번호 확인" value={newPw2} onChange={e=>setNewPw2(e.target.value)} maxLength={30} onKeyDown={e=>e.key==="Enter"&&submit()}/>
      {err&&<div style={{color:"#ef4444",fontSize:"13px",marginTop:"8px"}}>{err}</div>}
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"16px"}}>
        <button className="admin-btn admin-btn-secondary" onClick={onCancel} disabled={loading}>취소</button>
        <button className="admin-btn admin-btn-primary" onClick={submit} disabled={loading}>{loading?"변경 중...":"변경"}</button>
      </div>
    </div>
  </div>;
}

// ═══ 닉네임 제한 관리 ═══
function BannedNicknames({adminHash}){
  const[list,setList]=useState([]);
  const[loading,setLoading]=useState(true);
  const[nick,setNick]=useState("");
  const[reason,setReason]=useState("");
  const[err,setErr]=useState("");
  const[adding,setAdding]=useState(false);
  const[delId,setDelId]=useState(null);

  const load=useCallback(async()=>{
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/list_banned_nicknames",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash})});
      if(!r.ok)throw new Error(r.status);
      const data=await r.json();
      setList(data||[]);
    }catch(e){console.error("Load banned error:",e)}
    setLoading(false);
  },[adminHash]);

  useEffect(()=>{load()},[load]);

  const addBan=async()=>{
    const n=nick.trim();
    if(!n){setErr("닉네임을 입력하세요");return}
    setAdding(true);setErr("");
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/add_banned_nickname",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash,p_nickname:n,p_reason:reason.trim()})});
      if(!r.ok){const t=await r.text();if(t.includes("duplicate_nickname"))throw new Error("duplicate_nickname");throw new Error(r.status)}
      setNick("");setReason("");load();
    }catch(e){
      if(e.message==="duplicate_nickname")setErr("이미 제한된 닉네임입니다");
      else setErr("추가 실패: "+e.message);
    }
    setAdding(false);
  };

  const removeBan=async(id)=>{
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/remove_banned_nickname",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash,p_id:id})});
      if(!r.ok)throw new Error(r.status);
      setDelId(null);load();
    }catch(e){console.error("Remove banned error:",e)}
  };

  return <div style={{marginTop:"32px"}}>
    <div style={{fontWeight:700,fontSize:"18px",marginBottom:"16px",display:"flex",alignItems:"center",gap:"8px"}}>
      <span style={{fontSize:"20px"}}>🚫</span> 닉네임 제한 관리
      <span style={{fontSize:"13px",color:"var(--muted)",fontWeight:400}}>({list.length}개)</span>
    </div>

    {/* 추가 폼 */}
    <Box hover={false} style={{padding:"18px 22px",marginBottom:"16px"}}>
      <div style={{fontSize:"14px",fontWeight:600,marginBottom:"12px"}}>닉네임 제한 추가</div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
        <input className="admin-input" placeholder="차단할 닉네임" value={nick} onChange={e=>setNick(e.target.value)} maxLength={20} style={{flex:"1 1 120px",minWidth:"100px"}}/>
        <input className="admin-input" placeholder="사유 (선택)" value={reason} onChange={e=>setReason(e.target.value)} maxLength={50} style={{flex:"2 1 160px",minWidth:"120px"}}/>
        <button className="admin-btn admin-btn-primary" onClick={addBan} disabled={adding} style={{flexShrink:0}}>{adding?"추가 중...":"추가"}</button>
      </div>
      {err&&<div style={{color:"#ef4444",fontSize:"13px",marginTop:"8px"}}>{err}</div>}
      <div style={{fontSize:"12px",color:"var(--dimmer)",marginTop:"8px"}}>제한된 닉네임은 채팅 입장과 내 매매 닉네임 사용이 차단됩니다. (대소문자 구분 없음)</div>
    </Box>

    {/* 목록 */}
    {loading?<Loader/>:list.length===0?
      <Box hover={false} style={{textAlign:"center",padding:"40px 20px"}}>
        <div style={{fontSize:"28px",marginBottom:"8px"}}>✅</div>
        <div style={{color:"var(--muted)",fontSize:"14px"}}>제한된 닉네임이 없습니다</div>
      </Box>
    :
      <Box hover={false} style={{padding:0,overflow:"hidden"}}>
        {list.map(b=><div key={b.id} className="ban-item">
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
              <span style={{fontWeight:600,fontSize:"14px",color:"var(--text)"}}>{b.nickname}</span>
              {b.reason&&<span style={{fontSize:"12px",color:"var(--muted)",padding:"2px 8px",background:"var(--hover)",borderRadius:"6px"}}>{b.reason}</span>}
            </div>
            <div style={{fontSize:"12px",color:"var(--dimmer)",marginTop:"2px"}}>{new Date(b.created_at).toLocaleDateString("ko-KR",{year:"numeric",month:"short",day:"numeric"})}</div>
          </div>
          <button className="admin-btn admin-btn-danger" onClick={()=>setDelId(b.id)} style={{padding:"6px 12px",fontSize:"12px",flexShrink:0}}>해제</button>
        </div>)}
      </Box>
    }

    {delId&&<div className="modal-overlay" onClick={()=>setDelId(null)}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:700,fontSize:"16px",marginBottom:"12px"}}>닉네임 제한 해제</div>
        <div style={{fontSize:"14px",color:"var(--text-sub)",marginBottom:"20px"}}>이 닉네임의 제한을 해제하시겠습니까?</div>
        <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
          <button className="admin-btn admin-btn-secondary" onClick={()=>setDelId(null)}>취소</button>
          <button className="admin-btn admin-btn-danger" onClick={()=>removeBan(delId)}>해제</button>
        </div>
      </div>
    </div>}
  </div>;
}

// ═══ 칼럼 (반자동 글쓰기) ═══
const COL_ERR={unauthorized:"권한이 없습니다 (최고관리자만)",title_required:"제목을 5자 이상 써 주세요",body_too_short:"본문이 너무 짧습니다 (300자 이상)",opinion_required:"AI 초안은 운영자 의견을 100자 이상 써야 발행할 수 있습니다",not_found:"글을 찾을 수 없습니다"};
const COL_ST={draft:{t:"초안",c:"#f59e0b"},approved:{t:"발행 대기",c:"#06b6d4"},published:{t:"공개됨",c:"#22c55e"},discarded:{t:"버림",c:"#94a3b8"}};
async function colRpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const t=await r.text();
  if(!r.ok){const k=Object.keys(COL_ERR).find(k=>t.includes(k));throw new Error(k?COL_ERR[k]:(r.status===404?"setup_column.sql 을 먼저 실행하세요":"오류 "+r.status))}
  return t?JSON.parse(t):null;
}
function colInline(s,key){
  return s.split(/(\*\*[^*]+\*\*)/).map((x,i)=>/^\*\*[^*]+\*\*$/.test(x)?<strong key={key+"b"+i}>{x.slice(2,-2)}</strong>:x);
}
function ColMd({text}){
  const out=[];let para=[],lst=null,k=0;
  const flush=()=>{
    if(para.length){const p=para;out.push(<p key={k++}>{p.map((x,i)=><React.Fragment key={i}>{i>0&&<br/>}{colInline(x,"p"+k+i)}</React.Fragment>)}</p>);para=[]}
    if(lst){const L=lst;const items=L.items.map((x,i)=><li key={i}>{colInline(x,"l"+i)}</li>);out.push(L.tag==="ul"?<ul key={k++}>{items}</ul>:<ol key={k++}>{items}</ol>);lst=null}
  };
  for(const raw of (text||"").replace(/\r\n/g,"\n").split("\n")){
    const s=raw.trim();let m;
    if(!s){flush();continue}
    if((m=s.match(/^(#{1,4})\s+(.*)$/))){flush();out.push(m[1].length<=2?<h2 key={k++}>{colInline(m[2],"h"+k)}</h2>:<h3 key={k++}>{colInline(m[2],"h"+k)}</h3>);continue}
    const ul=s.match(/^[-*•]\s+(.*)$/),ol=s.match(/^\d+[.)]\s+(.*)$/);
    if(ul||ol){const tag=ul?"ul":"ol";if(para.length){const l=lst;lst=null;flush();lst=l}if(!lst||lst.tag!==tag){flush();lst={tag,items:[]}}lst.items.push((ul||ol)[1]);continue}
    if(s.startsWith(">")){flush();out.push(<blockquote key={k++}>{colInline(s.replace(/^>\s*/,""),"q"+k)}</blockquote>);continue}
    if(lst)flush();
    para.push(s);
  }
  flush();
  return <div className="col-prev">{out}</div>;
}
const colLen=s=>(s||"").replace(/[#*>\-\s]/g,"").length;

function ColumnEditor({post,adminHash,onDone,onClose}){
  const[f,setF]=useState({title:post.title||"",summary:post.summary||"",body:post.body||"",opinion:post.opinion||""});
  const[preview,setPreview]=useState(false);
  const[busy,setBusy]=useState("");
  const[err,setErr]=useState("");
  const[showData,setShowData]=useState(false);
  const isAuto=post.kind==="auto";
  const hints=(post.data&&post.data.opinion_hints)||[];
  const facts=post.data&&post.data.facts;
  const dirty=f.title!==(post.title||"")||f.summary!==(post.summary||"")||f.body!==(post.body||"")||f.opinion!==(post.opinion||"");
  const set=k=>e=>setF(o=>({...o,[k]:e.target.value}));
  const save=async(status)=>{
    setBusy(status);setErr("");
    try{
      const r=await colRpc("column_save",{p_admin_hash:adminHash,p_id:post.id||null,p_title:f.title,p_summary:f.summary,p_body:f.body,p_opinion:f.opinion,p_status:status});
      onDone(r&&r.id,status);
    }catch(e){setErr(e.message)}
    setBusy("");
  };
  const opLen=colLen(f.opinion);
  const close=()=>{if(dirty&&!confirm("저장하지 않은 내용이 있습니다. 닫을까요?"))return;onClose()};
  return <Box hover={false} style={{padding:"20px 22px"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <button className="admin-btn admin-btn-secondary" onClick={close} style={{padding:"6px 12px",fontSize:13}}>← 목록</button>
      <span style={{fontSize:13,color:"var(--muted)"}}>{post.date||"새 글"} · {isAuto?"AI 초안":"직접 쓴 글"}{post.status&&<> · <span style={{color:COL_ST[post.status].c,fontWeight:600}}>{COL_ST[post.status].t}</span></>}</span>
      {post.status==="published"&&post.slug&&<a href={"column/"+post.slug+".html"} target="_blank" rel="noopener" style={{fontSize:13,color:"#06b6d4",marginLeft:"auto"}}>공개 페이지 ↗</a>}
    </div>
    {post.data&&post.data.error&&<div style={{fontSize:13,color:"#ef4444",marginBottom:10}}>AI 초안 생성 실패: {post.data.error} — 아래 데이터를 보고 직접 써 주세요.</div>}
    <label className="col-lbl">제목</label>
    <input className="admin-input" value={f.title} onChange={set("title")} maxLength={120} placeholder="그날의 핵심이 드러나는 제목"/>
    <label className="col-lbl">요약 <span>검색 결과·목록에 보이는 두 문장</span></label>
    <textarea className="admin-input" rows={2} value={f.summary} onChange={set("summary")} maxLength={300}/>
    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:14}}>
      <label className="col-lbl" style={{margin:0}}>본문 <span>{colLen(f.body).toLocaleString()}자 · ## 소제목, - 목록, **굵게**</span></label>
      <div style={{marginLeft:"auto",display:"flex",gap:4}}>
        <button className={"col-seg"+(!preview?" on":"")} onClick={()=>setPreview(false)}>편집</button>
        <button className={"col-seg"+(preview?" on":"")} onClick={()=>setPreview(true)}>미리보기</button>
      </div>
    </div>
    {preview?<div className="admin-input" style={{minHeight:300,marginTop:6}}><ColMd text={f.body}/></div>
      :<textarea className="admin-input" rows={18} value={f.body} onChange={set("body")} style={{marginTop:6,lineHeight:1.7,resize:"vertical"}}/>}
    <label className="col-lbl" style={{marginTop:16}}>✍ 운영자 의견 <span style={{color:isAuto&&opLen<100?"#f59e0b":"var(--muted)"}}>{opLen}자{isAuto?" / 발행하려면 100자 이상":" (선택)"}</span></label>
    {hints.length>0&&<div className="col-hints">{hints.map((h,i)=><div key={i}>· {h}</div>)}</div>}
    <textarea className="admin-input" rows={6} value={f.opinion} onChange={set("opinion")} placeholder="AI가 쓸 수 없는 내 판단·경험을 써 주세요. 예: 오늘 이 종목을 직접 산다면 무엇을 더 확인하겠는가, 지난번 비슷한 상황에서 어땠는가" style={{lineHeight:1.7,resize:"vertical"}}/>
    {facts&&<div style={{marginTop:12}}>
      <button className="col-seg" onClick={()=>setShowData(v=>!v)}>{showData?"▾":"▸"} 초안에 쓴 데이터 보기</button>
      {showData&&<pre style={{fontSize:12,maxHeight:320,overflow:"auto",background:"var(--hover)",padding:12,borderRadius:8,marginTop:6,whiteSpace:"pre-wrap",wordBreak:"break-all"}}>{JSON.stringify(facts,null,1)}</pre>}
    </div>}
    {err&&<div style={{color:"#ef4444",fontSize:13,marginTop:12}}>{err}</div>}
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:18,alignItems:"center"}}>
      <button className="admin-btn admin-btn-primary" disabled={!!busy} onClick={()=>save("approved")}>{busy==="approved"?"요청 중...":post.status==="published"?"수정 내용 다시 발행":"발행"}</button>
      <button className="admin-btn admin-btn-secondary" disabled={!!busy} onClick={()=>save("draft")}>{busy==="draft"?"저장 중...":post.status==="published"||post.status==="approved"?"발행 취소 (초안으로)":"임시 저장"}</button>
      {post.id&&post.status!=="published"&&<button className="admin-btn admin-btn-danger" disabled={!!busy} onClick={()=>{if(confirm("이 글을 버릴까요? (30일 뒤 목록에서 사라짐)"))save("discarded")}}>버리기</button>}
    </div>
    <div style={{fontSize:12,color:"var(--dimmer)",marginTop:10,lineHeight:1.6}}>발행하면 다음 크롤링(보통 5~10분 안) 때 <b>column/{post.slug||"…"}.html</b> 페이지가 만들어져 사이트에 올라갑니다. 발행 취소하면 다음 크롤링 때 페이지가 지워집니다.</div>
  </Box>;
}

function ColumnManager({adminHash}){
  const[list,setList]=useState(null);
  const[err,setErr]=useState("");
  const[open,setOpen]=useState(null);
  const[showOld,setShowOld]=useState(false);
  const load=useCallback(async(reopen)=>{
    try{const d=await colRpc("column_list",{p_admin_hash:adminHash});setList(d||[]);setErr("");
      if(reopen){const p=(d||[]).find(x=>x.id===reopen);if(p)setOpen(p)}
    }catch(e){setErr(e.message);setList([])}
  },[adminHash]);
  useEffect(()=>{load()},[load]);
  if(list===null)return <Loader/>;
  if(open)return <ColumnEditor key={open.id||"new"} post={open} adminHash={adminHash} onClose={()=>{setOpen(null);load()}} onDone={(id,st)=>{if(st==="draft"&&open.id){load(id)}else if(st==="draft"){load(id)}else{setOpen(null);load()}}}/>;
  const groups=[["draft","✏️ 검토할 초안"],["approved","⏳ 발행 대기 (다음 크롤링 때 공개)"],["published","✅ 공개된 글"]];
  const pubN=list.filter(p=>p.status==="published"||p.status==="approved").length;
  return <div>
    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <div>
        <div style={{fontWeight:700,fontSize:18}}>칼럼</div>
        <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>공개 {pubN}개 · 평일 장 마감 후(17:30~) AI 초안이 하루 1개 만들어집니다</div>
      </div>
      <button className="admin-btn admin-btn-primary" onClick={()=>setOpen({kind:"manual",data:null})} style={{marginLeft:"auto",padding:"8px 16px",fontSize:13}}>＋ 직접 쓰기</button>
    </div>
    <Box hover={false} style={{padding:"12px 16px",marginBottom:16,fontSize:13,color:"var(--text-sub)",lineHeight:1.7}}>
      AI 초안을 그대로 올리면 애드센스에서 '자동 생성 콘텐츠'로 볼 수 있습니다. <b>제목·요약을 내 말로 다듬고, 틀린 문장은 지우고, 운영자 의견(100자 이상)을 꼭 쓰세요.</b> 매일 다 올릴 필요는 없습니다 — 일주일에 2~3개, 쓸 거리가 있는 날만 고르는 편이 낫습니다.
    </Box>
    {err&&<div style={{color:"#ef4444",fontSize:13,marginBottom:12}}>{err}</div>}
    {groups.map(([st,label])=>{
      const items=list.filter(p=>p.status===st);
      if(!items.length&&st!=="draft")return null;
      return <div key={st} style={{marginBottom:18}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:8}}>{label} <span style={{color:"var(--muted)",fontWeight:400}}>({items.length})</span></div>
        <Box hover={false} style={{padding:0,overflow:"hidden"}}>
          {items.length===0?<div style={{padding:"18px",fontSize:13,color:"var(--muted)"}}>검토할 초안이 없습니다</div>
          :items.map(p=><div key={p.id} className="ban-item" style={{cursor:"pointer"}} onClick={()=>setOpen(p)}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.title||"(제목 없음)"}</div>
              <div style={{fontSize:12,color:"var(--dimmer)",marginTop:2}}>{p.date} · {p.kind==="auto"?"AI 초안":"직접 쓴 글"} · 본문 {colLen(p.body).toLocaleString()}자 · 의견 {colLen(p.opinion)}자{p.data&&p.data.error?" · ⚠ 생성 실패":""}</div>
            </div>
            <span style={{fontSize:12,fontWeight:600,color:COL_ST[p.status].c,flexShrink:0}}>{COL_ST[p.status].t}</span>
          </div>)}
        </Box>
      </div>;
    })}
    {list.some(p=>p.status==="discarded")&&<div>
      <button className="col-seg" onClick={()=>setShowOld(v=>!v)}>{showOld?"▾":"▸"} 버린 글 ({list.filter(p=>p.status==="discarded").length})</button>
      {showOld&&<Box hover={false} style={{padding:0,overflow:"hidden",marginTop:8}}>
        {list.filter(p=>p.status==="discarded").map(p=><div key={p.id} className="ban-item" style={{cursor:"pointer"}} onClick={()=>setOpen(p)}>
          <div style={{flex:1,fontSize:13}}>{p.date} · {p.title||"(제목 없음)"}</div>
        </div>)}
      </Box>}
    </div>}
  </div>;
}

function AdminDashboard({adminHash,adminInfo,onLogout,onHashChanged}){
  const[admins,setAdmins]=useState([]);
  const[loading,setLoading]=useState(true);
  const[deleteTarget,setDeleteTarget]=useState(null);
  const[showPwModal,setShowPwModal]=useState(false);
  const[view,setView]=useState(()=>{try{return sessionStorage.getItem("sp-admin-view")||"column"}catch(e){return "column"}});
  const setViewS=v=>{setView(v);try{sessionStorage.setItem("sp-admin-view",v)}catch(e){}};

  const loadAdmins=useCallback(async()=>{
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/list_board_admins",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash})});
      if(!r.ok)throw new Error(r.status);
      const data=await r.json();
      setAdmins(data||[]);
    }catch(e){console.error("Load admins error:",e)}
    setLoading(false);
  },[adminHash]);

  useEffect(()=>{loadAdmins()},[loadAdmins]);

  const handleDelete=async()=>{
    if(!deleteTarget)return;
    try{
      const r=await fetch(SB_URL+"/rest/v1/rpc/delete_board_admin",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_admin_hash:adminHash,p_target_id:deleteTarget.id})});
      if(!r.ok)throw new Error(r.status);
      setDeleteTarget(null);
      loadAdmins();
    }catch(e){console.error("Delete error:",e)}
  };

  if(adminInfo.role!=="superadmin"){
    return <div>
      <Box hover={false} style={{padding:"24px",textAlign:"center"}}>
        <div style={{fontSize:"36px",marginBottom:"10px"}}>👤</div>
        <div style={{fontWeight:700,fontSize:"18px",marginBottom:"8px"}}>{adminInfo.nickname}</div>
        <span className="role-badge role-mod">부관리자</span>
        <div style={{marginTop:"20px",fontSize:"14px",color:"var(--text-sub)"}}>
          <div style={{fontWeight:600,marginBottom:"10px"}}>내 권한</div>
          <div className="perm-row" style={{justifyContent:"center"}}>
            {PERM_KEYS.map(p=><span key={p.key} style={{padding:"4px 12px",borderRadius:8,fontSize:"13px",background:adminInfo.permissions[p.key]?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",color:adminInfo.permissions[p.key]?"#22c55e":"#ef4444"}}>{p.label}: {adminInfo.permissions[p.key]?"O":"X"}</span>)}
          </div>
        </div>
        <div style={{display:"flex",gap:"8px",justifyContent:"center",marginTop:"24px"}}>
          <button className="admin-btn admin-btn-secondary" onClick={()=>setShowPwModal(true)}>비밀번호 변경</button>
          <button className="admin-btn admin-btn-secondary" onClick={onLogout}>로그아웃</button>
        </div>
      </Box>
      {showPwModal&&<ChangePwModal adminHash={adminHash} onChanged={(h)=>{setShowPwModal(false);onHashChanged(h)}} onCancel={()=>setShowPwModal(false)}/>}
    </div>;
  }

  return <div>
    <div style={{display:"flex",gap:6,marginBottom:22}}>
      <button className={"col-seg big"+(view==="column"?" on":"")} onClick={()=>setViewS("column")}>✍ 칼럼</button>
      <button className={"col-seg big"+(view==="admins"?" on":"")} onClick={()=>setViewS("admins")}>👥 관리자·닉네임</button>
    </div>
    {view==="column"?<ColumnManager adminHash={adminHash}/>:<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"8px"}}>
      <div>
        <div style={{fontWeight:700,fontSize:"18px"}}>관리자 목록</div>
        <div style={{fontSize:"13px",color:"var(--muted)",marginTop:"2px"}}>총 {admins.length}명</div>
      </div>
      <div style={{display:"flex",gap:"8px"}}>
        <button className="admin-btn admin-btn-secondary" onClick={()=>setShowPwModal(true)} style={{padding:"8px 16px",fontSize:"13px"}}>🔑 비밀번호 변경</button>
        <button className="admin-btn admin-btn-secondary" onClick={onLogout} style={{padding:"8px 16px",fontSize:"13px"}}>로그아웃</button>
      </div>
    </div>

    {loading?<Loader/>:<Box hover={false} style={{padding:0,overflow:"auto"}}>
      <table className="admin-table">
        <thead><tr>
          <th style={{width:40,textAlign:"center"}}>#</th>
          <th>관리자</th>
          {PERM_KEYS.map(p=><th key={p.key} style={{textAlign:"center",width:70,fontSize:"12px"}}>{p.label}</th>)}
          <th style={{width:60,textAlign:"center"}}>관리</th>
        </tr></thead>
        <tbody>
          {admins.map(a=><AdminRow key={a.id} admin={a} adminHash={adminHash} onUpdated={loadAdmins} onDelete={setDeleteTarget}/>)}
        </tbody>
      </table>
    </Box>}

    <AddAdminForm adminHash={adminHash} onAdded={loadAdmins}/>

    <BannedNicknames adminHash={adminHash}/>
    </>}

    {deleteTarget&&<ConfirmModal nickname={deleteTarget.nickname} onConfirm={handleDelete} onCancel={()=>setDeleteTarget(null)}/>}
    {showPwModal&&<ChangePwModal adminHash={adminHash} onChanged={(h)=>{setShowPwModal(false);onHashChanged(h)}} onCancel={()=>setShowPwModal(false)}/>}
  </div>;
}

function App(){
  const[theme,setTheme]=useState(getStoredTheme());
  const[adminHash,setAdminHash]=useState(sessionStorage.getItem("sp-admin-hash")||"");
  const[adminInfo,setAdminInfo]=useState(null);
  const[checking,setChecking]=useState(!!sessionStorage.getItem("sp-admin-hash"));

  useEffect(()=>{applyTheme(theme)},[theme]);
  const toggleTheme=()=>{const t=theme==="dark"?"light":"dark";setTheme(t);setStoredTheme(t);applyTheme(t)};

  // 세션 복원
  useEffect(()=>{
    if(!adminHash){setChecking(false);return}
    (async()=>{
      try{
        const r=await fetch(SB_URL+"/rest/v1/rpc/admin_login",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_hash:adminHash})});
        if(!r.ok)throw new Error();
        const data=await r.json();
        if(data){setAdminInfo(data)}
        else{sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      }catch(e){sessionStorage.removeItem("sp-admin-hash");setAdminHash("")}
      setChecking(false);
    })();
  },[]);

  const handleLogin=(hash,info)=>{
    sessionStorage.setItem("sp-admin-hash",hash);
    setAdminHash(hash);
    setAdminInfo(info);
  };

  const handleHashChanged=(newHash)=>{
    sessionStorage.setItem("sp-admin-hash",newHash);
    setAdminHash(newHash);
  };

  const handleLogout=()=>{
    sessionStorage.removeItem("sp-admin-hash");
    setAdminHash("");
    setAdminInfo(null);
  };

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <header style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"20px 40px",maxWidth:900,width:"100%",margin:"0 auto",boxSizing:"border-box"}}>
      <a href="index.html" style={{fontSize:"15px",fontWeight:700,color:"var(--text)",textDecoration:"none"}}>← STOCKPULSE</a>
      <button onClick={toggleTheme} style={{background:"none",border:"none",fontSize:"20px",cursor:"pointer"}}>{theme==="dark"?"☀️":"🌙"}</button>
    </header>

    <div style={{flex:1,maxWidth:900,width:"100%",margin:"0 auto",padding:"20px 40px 60px",boxSizing:"border-box"}}>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"28px"}}>
        <span style={{fontSize:"24px"}}>🔐</span>
        <h1 style={{fontSize:"22px",fontWeight:800,margin:0}}>관리자 페이지</h1>
      </div>

      {checking?<Loader/>:(!adminHash||!adminInfo)?<LoginScreen onLogin={handleLogin}/>:<AdminDashboard adminHash={adminHash} adminInfo={adminInfo} onLogout={handleLogout} onHashChanged={handleHashChanged}/>}
    </div>

    <footer style={{borderTop:"1px solid var(--div2)",maxWidth:900,margin:"0 auto",padding:"18px 40px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"8px",color:"var(--dimmer)",fontSize:"13px",width:"100%",boxSizing:"border-box"}}>
      <div><span style={{fontWeight:600,color:"var(--dim)"}}>STOCKPULSE</span> © 2026</div>
      <div className="footer-links">
        <a href="index.html">메인</a>
      </div>
    </footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
